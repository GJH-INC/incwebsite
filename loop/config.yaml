site: gjh-inc.com

# Loop 1 — what the agent looks at
targets:
  - id: home
    url: https://gjh-inc.com/
    intent: "Position GJH Inc. as an independent consulting firm helping organizations put AI and their data to practical use, with the working principles that give buyers confidence."

# Benchmarked against, not copied from. Used for relevancy gap analysis only.
competitors:
  - https://www.techjays.com/
  - https://www.v2.ai/
  - https://zireh.com.au/

models:
  grader: opencode/deepseek-v4-flash-free   # loop 2 — runs every cycle, high volume, free
  improver: opencode/deepseek-v4-flash-free # loop 4 — runs on trend, low volume
  researcher: opencode/deepseek-v4-flash-free # loop 5 — research agent, low volume

# Optional litellm-backed fallbacks, tried after the CLI route when their API
# key env var is present. Config-only — no litellm server to run.
litellm_fallbacks:
  # - openai/gpt-4o-mini              # needs OPENAI_API_KEY
  # - anthropic/claude-3-5-haiku-latest # needs ANTHROPIC_API_KEY

# Loop 5 — market research agent config
research:
  min_competitor_text: 100     # ignore a competitor page with less text than this
  top_gaps: 8                  # how many gaps the report surfaces per page

thresholds:
  # Below this overall score the workflow opens a P1 issue instead of a routine PR.
  fail_below: 3.2
  # A drop this large vs the previous run is treated as a regression.
  regression_delta: 0.4
  # Loop 2 retries when the grader returns unparseable or incomplete output.
  max_grader_retries: 3

# Deterministic pre-grader — no tokens, objective, trends cleanly.
static_checks:
  min_rendered_words: 200        # server-rendered text an AI crawler can actually read
  require_title: true
  require_meta_description: true
  require_schema_org: true       # Organization JSON-LD
  banned_words:
    - reimagine
    - unlock
    - revolutionize
    - cutting-edge
    - seamlessly
    - empower
    - game-changing
    - transformative
    - harness the power
  required_signals:              # positioning vocabulary that must survive edits
    - consulting
    - ai
    - data
    - assessment
    - own
